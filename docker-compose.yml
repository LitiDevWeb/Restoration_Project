version: "3.9"
services:
  codebase:
    build: ./
    command: bash -c "npx prisma generate && npx prisma migrate deploy && npx prisma db seed && npm run build && npm run start"
    env_file:
      - .env
    volumes:
      # SQLite keeps the whole database in a single file. ./data is gitignored, so the
      # data survives image rebuilds and never lands in version control.
      - ./data:/app/data
    ports:
      - "3000:3000"
    restart: on-failure
